[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubectl-namespace-health"
version = "1.0.0"
description = "A simulated kubectl namespace health plugin for readiness, restarts and Warning events"
requires-python = ">=3.11"
authors = [{name = "Ayaan Jindal"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["coverage>=7.6"]

[project.scripts]
kubectl-ns_health = "ns_health.cli:main"

[tool.setuptools.packages.find]
include = ["ns_health*"]

[tool.setuptools.package-data]
ns_health = ["data/*.json"]

[tool.coverage.run]
source = ["ns_health"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.uv]
default-groups = ["web"]
