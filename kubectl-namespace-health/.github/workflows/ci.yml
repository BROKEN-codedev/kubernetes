name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install coverage
      - run: python scripts/build_wheel.py
      - run: python -m pip install --no-index dist/kubectl_namespace_health-1.0.0-py3-none-any.whl
      - run: python -m coverage run --source=ns_health -m unittest discover -s tests -v
      - run: python -m coverage report -m --fail-under=85
